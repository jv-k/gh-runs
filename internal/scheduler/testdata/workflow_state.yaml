---
version: 2
interactions:
    # One repository whose Runs belong to two Workflows: 9001, whose YAML has been
    # deleted, and 9002, which is still active. Both Runs are completed, so the
    # repository is slow-tier and the test drives its second poll by advancing the
    # injected clock.
    # Interaction 0: the cold-start poll, unconditional, a 200 carrying both Runs.
    - id: 0
      request:
        method: GET
        url: https://api.github.com/repos/acme/legacy/actions/runs
      response:
        status: 200 OK
        code: 200
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        body: '{"total_count":2,"workflow_runs":[{"id":1,"workflow_id":9001,"status":"completed","conclusion":"failure","name":"Old Pipeline"},{"id":2,"workflow_id":9002,"status":"completed","conclusion":"success","name":"CI"}]}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            Etag:
                - '"legacy-v1"'
            X-Ratelimit-Remaining:
                - "5000"
    # Interaction 1: the steady-state poll, conditional, answered with a changed 200
    # rather than a 304, so a second Update is emitted and its Runs are stamped again.
    # A third Run arrives on the same deleted Workflow.
    - id: 1
      request:
        method: GET
        url: https://api.github.com/repos/acme/legacy/actions/runs
        headers:
            If-None-Match:
                - '"legacy-v1"'
      response:
        status: 200 OK
        code: 200
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        body: '{"total_count":3,"workflow_runs":[{"id":3,"workflow_id":9001,"status":"completed","conclusion":"failure","name":"Old Pipeline"},{"id":1,"workflow_id":9001,"status":"completed","conclusion":"failure","name":"Old Pipeline"},{"id":2,"workflow_id":9002,"status":"completed","conclusion":"success","name":"CI"}]}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            Etag:
                - '"legacy-v2"'
            X-Ratelimit-Remaining:
                - "4999"
    # Interaction 2: the repository's Workflow list, read once for the join, unconditional.
    # It is replayable, so a second read would be answered rather than refused: a test that
    # counts one read is measuring the engine's memo and not the fixture's patience.
    - id: 2
      request:
        method: GET
        url: https://api.github.com/repos/acme/legacy/actions/workflows?per_page=100
      response:
        status: 200 OK
        code: 200
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        body: '{"total_count":2,"workflows":[{"id":9001,"name":"Old Pipeline","path":".github/workflows/old.yml","state":"deleted"},{"id":9002,"name":"CI","path":".github/workflows/ci.yml","state":"active"}]}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            Etag:
                - '"legacy-workflows-v1"'
            X-Ratelimit-Remaining:
                - "4998"
