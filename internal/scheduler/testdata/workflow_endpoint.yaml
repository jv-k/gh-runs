---
version: 2
interactions:
    # A filter naming Workflow 9004 by its numeric id. The poll must reach the Workflow's own
    # Run listing, the only server-side form the Workflow axis has (ADR-0016), carrying the
    # same per_page the rest of the tool sends. total_count is the Workflow's whole match
    # count, far past what one page reaches, which is the claimed count R24's cap label reads.
    # The Runs are the deleted Workflow's Orphaned Runs: old, and unreachable from the newest
    # page of the repository listing, which is the case this endpoint exists to serve.
    - id: 0
      request:
        method: GET
        url: https://api.github.com/repos/acme/legacy/actions/workflows/9004/runs?per_page=100
      response:
        status: 200 OK
        code: 200
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        body: '{"total_count":4106,"workflow_runs":[{"id":11,"workflow_id":9004,"status":"completed","conclusion":"failure","name":"Old Pipeline"},{"id":12,"workflow_id":9004,"status":"completed","conclusion":"success","name":"Old Pipeline"}]}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            Etag:
                - '"legacy-wf9004-v1"'
            X-Ratelimit-Remaining:
                - "5000"
