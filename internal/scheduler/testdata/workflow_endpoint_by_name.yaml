---
version: 2
interactions:
    # Interaction 0: the Workflow list, the read the state join already pays for once per
    # repository. A name or filename selector resolves through it (ADR-0016), so the
    # resolution costs no request of its own.
    - id: 0
      request:
        method: GET
        url: https://api.github.com/repos/acme/legacy/actions/workflows?per_page=100
      response:
        status: 200 OK
        code: 200
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        body: '{"total_count":2,"workflows":[{"id":9004,"name":"Old Pipeline","path":".github/workflows/old.yml","state":"deleted"},{"id":9002,"name":"CI","path":".github/workflows/ci.yml","state":"active"}]}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            Etag:
                - '"legacy-workflows-v1"'
            X-Ratelimit-Remaining:
                - "5000"
    # Interaction 1: the resolved Workflow's own Run listing.
    - id: 1
      request:
        method: GET
        url: https://api.github.com/repos/acme/legacy/actions/workflows/9004/runs?per_page=100
      response:
        status: 200 OK
        code: 200
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        body: '{"total_count":4106,"workflow_runs":[{"id":11,"workflow_id":9004,"status":"completed","conclusion":"failure","name":"Old Pipeline"}]}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            Etag:
                - '"legacy-wf9004-v1"'
            X-Ratelimit-Remaining:
                - "5000"
    # Interaction 2: the fallback, for a selector this repository has no Workflow for. The
    # ordinary listing is polled and the client-side Match evicts every Run.
    - id: 2
      request:
        method: GET
        url: https://api.github.com/repos/acme/legacy/actions/runs?per_page=100
      response:
        status: 200 OK
        code: 200
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        body: '{"total_count":2,"workflow_runs":[{"id":21,"workflow_id":9002,"status":"completed","conclusion":"success","name":"CI"}]}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            Etag:
                - '"legacy-runs-v1"'
            X-Ratelimit-Remaining:
                - "5000"
