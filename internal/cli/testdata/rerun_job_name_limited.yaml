# run-lifecycle AC14d, taped at the figures the criterion names: 40 selected Runs spanning
# two repositories, whose resolution is rate-limited after 12 Runs of which every one holds
# the named Job. The set spans repositories, so R17's friction is the typed count, and on
# the CLI --yes stands in for it (cli-surface R11).
#
# Exactly 12 re-run POSTs follow, which is the whole of the frozen set because none of the
# 12 was unmatched. The 28 appear in no count and under no skip reason: they were never
# answered, so they are unreached and not Item-less members (R17a). The 12 resolution reads
# are not re-run requests and are counted as neither.
#
# The 403 on Run 13's listing carries a documentation_url pointing at the fine-grained-PAT
# permissions page rather than at this endpoint's own reference, so it fails the
# authorization-shape correspondence and the governor classifies it as rate limiting, the
# safe default (rate-governor open question 1). The tape holds nothing after it, so a
# resolution that carried on would fail the replay.
