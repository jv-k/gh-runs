---
version: 2
interactions:
    # R23's other definitive signal: a 403 the governor reports as NOT rate limiting.
    # Its documentation_url points at the reference page for the endpoint requested
    # (workflow-runs names runs), which is the correspondence the governor's classifier
    # measures. This is the fixture that proves 404 is not the only definitive answer.
    # Interaction 0: enumeration, one page, no rel="next", so the walk stops here.
    - id: 0
      request:
        method: GET
        url: https://api.github.com/user/repos?per_page=100&affiliation=owner,collaborator,organization_member
      response:
        status: 200 OK
        code: 200
        body: '[{"name":"alpha","full_name":"jv-k/alpha","owner":{"login":"jv-k"},"permissions":{"admin":true,"maintain":true,"push":true,"triage":true,"pull":true},"archived":false,"disabled":false,"default_branch":"main"}]'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            X-Ratelimit-Limit:
                - "5000"
            X-Ratelimit-Remaining:
                - "4900"
            X-Ratelimit-Reset:
                - "1789000000"
            X-Ratelimit-Used:
                - "100"
    # Interaction 1: alpha's first probe. 200 and NO ETag, so every later probe of it
    # is unconditional and the sequence below is matched in request order.
    - id: 1
      request:
        method: GET
        url: https://api.github.com/repos/jv-k/alpha/actions/runs
      response:
        status: 200 OK
        code: 200
        body: '{"total_count":1,"workflow_runs":[{"id":1,"status":"completed","conclusion":"success"}]}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            X-Ratelimit-Limit:
                - "5000"
            X-Ratelimit-Remaining:
                - "4900"
            X-Ratelimit-Reset:
                - "1789000000"
            X-Ratelimit-Used:
                - "100"
    # Interaction 2: an authorization 403. Definitive, so the count goes to one.
    - id: 2
      request:
        method: GET
        url: https://api.github.com/repos/jv-k/alpha/actions/runs
      response:
        status: 403 Forbidden
        code: 403
        body: '{"message":"Resource not accessible by personal access token","documentation_url":"https://docs.github.com/rest/actions/workflow-runs#list-workflow-runs-for-a-repository"}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            X-Ratelimit-Limit:
                - "5000"
            X-Ratelimit-Remaining:
                - "4900"
            X-Ratelimit-Reset:
                - "1789000000"
            X-Ratelimit-Used:
                - "100"
    # Interaction 3: a second authorization 403. R23 retires it here.
    - id: 3
      request:
        method: GET
        url: https://api.github.com/repos/jv-k/alpha/actions/runs
      response:
        status: 403 Forbidden
        code: 403
        body: '{"message":"Resource not accessible by personal access token","documentation_url":"https://docs.github.com/rest/actions/workflow-runs#list-workflow-runs-for-a-repository"}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            X-Ratelimit-Limit:
                - "5000"
            X-Ratelimit-Remaining:
                - "4900"
            X-Ratelimit-Reset:
                - "1789000000"
            X-Ratelimit-Used:
                - "100"
