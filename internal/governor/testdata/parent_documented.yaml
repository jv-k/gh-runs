      response:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        body: '{"message":"Resource not accessible by personal access token","documentation_url":"https://docs.github.com/rest/actions/workflows#create-a-workflow-dispatch-event"}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            X-Ratelimit-Remaining:
