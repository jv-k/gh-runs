            X-Ratelimit-Reset:
                - "1789000000"
        status: 403 Forbidden
        code: 403
    # DELETE a Cache: rate-governor R2's Cache deletion. The reference page is
    # /rest/actions/cache, singular, while the endpoint says caches. Nothing is stepped
    # over here, the plural is.
    - id: 8
      request:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        content_length: 0
        host: api.github.com
        headers: {}
        url: https://api.github.com/repos/o/r/actions/caches/123
        method: DELETE
      response:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        body: '{"message":"Resource not accessible by personal access token","documentation_url":"https://docs.github.com/rest/actions/cache#delete-a-github-actions-cache-for-a-repository-using-a-cache-id"}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            X-Ratelimit-Remaining:
                - "4968"
            X-Ratelimit-Reset:
                - "1789000000"
        status: 403 Forbidden
        code: 403
    # DELETE an Artifact: R2's Artifact deletion. Its page is the plural /rest/actions/
    # artifacts, so this one already corresponded, and it is taped to keep R2's ten
    # writes covered rather than most of them.
    - id: 9
      request:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        content_length: 0
        host: api.github.com
        headers: {}
        url: https://api.github.com/repos/o/r/actions/artifacts/77
        method: DELETE
      response:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        body: '{"message":"Resource not accessible by personal access token","documentation_url":"https://docs.github.com/rest/actions/artifacts#delete-an-artifact"}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            X-Ratelimit-Remaining:
                - "4967"
            X-Ratelimit-Reset:
                - "1789000000"
        status: 403 Forbidden
        code: 403
    # DELETE a Run's logs: R2's log deletion (log-viewer R17), documented on the
    # workflow-runs page, which carries neither logs nor the Run's id.
    - id: 10
      request:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        content_length: 0
        host: api.github.com
        headers: {}
