    - id: 3
      request:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        content_length: 0
        host: api.github.com
        headers: {}
        url: https://api.github.com/repos/o/r/actions/runs/4/rerun-failed-jobs
        method: POST
      response:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        body: '{"message":"Resource not accessible by personal access token","documentation_url":"https://docs.github.com/rest/actions/workflow-runs#re-run-failed-jobs-from-a-workflow-run"}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            X-Ratelimit-Remaining:
                - "4973"
            X-Ratelimit-Reset:
                - "1789000000"
        status: 403 Forbidden
        code: 403
