---
version: 2
# The parent-documented Actions endpoints: the ones whose last path segment is not what
# their reference page's path carries. Two shapes produce that. A segment that names an
# action (cancel, enable) or a sub-resource (logs, usage, pending_deployments) is
# documented on the PARENT resource's page, so the doc URL carries workflow-runs,
# workflows or cache instead. And a Cache is documented at /rest/actions/cache while the
# endpoint says caches, a plural the page's path does not carry.
#
# Every 403 here but the last three carries the measured authorization shape (open
# question 1): the message a fine-grained PAT gets, no Retry-After, a healthy
# x-ratelimit-remaining, and a documentation_url pointing at the endpoint's own
# reference page.
#
# The last three are the safe direction, unchanged: the rate-limits page, a Retry-After,
# and a trailing segment the classifier does not know, all rate limiting.
interactions:
    # POST cancel: run-lifecycle R3's expected 403 despite push: true.
    - id: 0
      request:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        content_length: 0
        host: api.github.com
        headers: {}
        url: https://api.github.com/repos/o/r/actions/runs/1/cancel
        method: POST
      response:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        body: '{"message":"Resource not accessible by personal access token","documentation_url":"https://docs.github.com/rest/actions/workflow-runs#cancel-a-workflow-run"}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            X-Ratelimit-Remaining:
                - "4976"
            X-Ratelimit-Reset:
                - "1789000000"
        status: 403 Forbidden
        code: 403
    # POST force-cancel: run-lifecycle R6's distinct escalation endpoint.
    - id: 1
      request:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        content_length: 0
        host: api.github.com
        headers: {}
        url: https://api.github.com/repos/o/r/actions/runs/2/force-cancel
        method: POST
      response:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        body: '{"message":"Resource not accessible by personal access token","documentation_url":"https://docs.github.com/rest/actions/workflow-runs#force-cancel-a-workflow-run"}'
        headers:
            Content-Type:
                - application/json; charset=utf-8
            X-Ratelimit-Remaining:
                - "4975"
            X-Ratelimit-Reset:
                - "1789000000"
        status: 403 Forbidden
        code: 403
    # POST rerun.
    - id: 2
      request:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        content_length: 0
        host: api.github.com
        headers: {}
        url: https://api.github.com/repos/o/r/actions/runs/3/rerun
        method: POST
      response:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        body: '{"message":"Resource not accessible by personal access token","documentation_url":"https://docs.github.com/rest/actions/workflow-runs#re-run-a-workflow"}'
