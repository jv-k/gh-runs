---
version: 2
# An expired Artifact's download answers 410 Gone (storage-reclamation R14, measured). The
# listing still reports the Artifact and its original size_in_bytes, so an Artifact that
# expired between the listing and the keystroke reaches this response. The outcome reads as
# the bytes being gone, never as a transient failure a retry might fix (AC9). No redirect and
# no blob interaction is taped, because there is nothing left to serve.
interactions:
    - id: 0
      request:
        method: GET
        url: https://api.github.com/repos/o/r/actions/artifacts/67890/zip
      response:
        status: 410 Gone
        code: 410
        body: '{"message":"Artifact has expired","documentation_url":"https://docs.github.com/rest/actions/artifacts#download-an-artifact","status":"410"}'
        headers:
            Content-Type: ["application/json; charset=utf-8"]
            X-Ratelimit-Remaining: ["4998"]
