---
version: 2
# The disable PUT answers the measured authorization 403 (rate-governor open question 1):
# a fine-grained PAT's message, no Retry-After, a healthy x-ratelimit-remaining, and a
# documentation_url pointing at disable's OWN reference page. Enable and disable are
# documented on the workflows page, so the doc URL names the Workflow rather than the
# /disable segment the request path ends in. It is taped ONCE: a re-attempt has no tape, so
# spending any of purge R19a's three backoffs on it would fail the replay. This is
# workflow-management R7's permission failure, reported with the API's own reason.
interactions:
    - id: 0
      request:
        method: PUT
        url: https://api.github.com/repos/o/r/actions/workflows/9002/disable
      response:
        status: 403 Forbidden
        code: 403
        body: '{"message":"Resource not accessible by personal access token","documentation_url":"https://docs.github.com/rest/actions/workflows#disable-a-workflow"}'
        headers:
            Content-Type: ["application/json; charset=utf-8"]
            X-Ratelimit-Remaining: ["4321"]
