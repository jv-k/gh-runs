---
version: 2
# The per-Job re-run endpoint under both readings R25 asks for, a success and a 404
# (run-lifecycle R14a, R22, R25).
#
# The path addresses a Job id and never a Run id, which is the whole reason this
# operation cannot ride the shared Run endpoint the other four build. The 201 is the API
# accepting the request, exactly as it is for a whole-Run re-run: it adds an Attempt
# rather than creating a Run (R8).
#
# The 404 is read as a failure here, the opposite of how a cancel reads the identical
# status, because a Job that cannot be found cannot gain an Attempt (R22, AC13). That is
# the same pairing lifecycle_404.yaml tapes one endpoint over.
#
# The matcher ignores the body, so this tape serves the default path and R14's
# enable_debug_logging path alike, and a test reads the captured request body to prove
# which was sent rather than matching on it.
interactions:
    - id: 0
      request:
        method: POST
        url: https://api.github.com/repos/o/r/actions/jobs/101/rerun
      response:
        status: 201 Created
        code: 201
        body: ""
        headers:
            X-Ratelimit-Remaining: ["4900"]
            X-Ratelimit-Reset: ["1789000000"]
    - id: 1
      request:
        method: POST
        url: https://api.github.com/repos/o/r/actions/jobs/102/rerun
      response:
        status: 201 Created
        code: 201
        body: ""
        headers:
            X-Ratelimit-Remaining: ["4899"]
            X-Ratelimit-Reset: ["1789000000"]
    # The Job is gone, so it cannot gain an Attempt. A failure, not a skip.
    - id: 2
      request:
        method: POST
        url: https://api.github.com/repos/o/r/actions/jobs/404/rerun
      response:
        status: 404 Not Found
        code: 404
        body: '{"message":"Not Found","documentation_url":"https://docs.github.com/rest"}'
        headers:
            Content-Type: ["application/json; charset=utf-8"]
            X-Ratelimit-Remaining: ["4898"]
