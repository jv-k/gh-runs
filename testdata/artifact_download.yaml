---
version: 2
# An Artifact download over the assembled transport chain (storage-reclamation R13): the zip
# endpoint answers a 302 to a short-lived signed blob URL, which the client follows to a 200
# body. The blob carries an ETag, which is what makes this cassette load-bearing: the
# local-store persists any 200 GET that carries one, so a download routed through the store
# would be read into memory whole and written to disk a second time. The wiring test asserts
# that the download's own client leaves the store empty and that the shared client does not,
# so the assertion cannot pass vacuously.
interactions:
    - id: 0
      request:
        method: GET
        url: https://api.github.com/repos/o/r/actions/artifacts/12345/zip
      response:
        status: 302 Found
        code: 302
        body: ""
        headers:
            Location: ["https://pipelines.blob.example/signed-artifact?sig=abc123"]
            X-Ratelimit-Remaining: ["4999"]
            X-Ratelimit-Reset: ["1789000000"]
    - id: 1
      request:
        method: GET
        url: https://pipelines.blob.example/signed-artifact?sig=abc123
      response:
        status: 200 OK
        code: 200
        headers:
            Content-Type: ["application/zip"]
            Etag: ['"0x8DBEEFCAFE12345"']
        body: "PK-artifact-zip-payload\n"
